name: protos

# `kit`: the checks themselves (typecheck, tests, tokens), on every pull request and on main.
# `protos`: what a designer's pull request must pass: only their folder, the laws, and a build.
# No path filter: a required check that never starts leaves the pull request pending forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kit:
    name: kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The render tests need a browser; without one they only warn.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:tokens
      - run: npm run tokens:check

  protos:
    name: protos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The author's text reaches the shell as data, never pasted into a script.
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      # The job runs the pull request's own code (render harness, next build): no token is left on disk for it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Branches the /deploy command opens (proto/<designer>/…) may change one folder and nothing else.
      - name: Only web/protos/<designer>/
        if: startsWith(github.head_ref, 'proto/')
        run: |
          designer=$(printf '%s' "$HEAD_REF" | cut -d/ -f2)
          outside=$(git diff --name-only "origin/$BASE_REF...HEAD" | awk -v p="web/protos/${designer}/" 'index($0, p) != 1')
          if [ -n "$outside" ]; then
            echo "Esta branch muda arquivos fora de web/protos/${designer}/:"; echo "$outside"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium

      # The laws run on every touched screen and may fail; the report is still built and posted, then the job fails.
      - name: Laws, on every screen and flow the pull request touches
        id: laws
        run: |
          screens=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- 'web/protos/**/*.tsx' 'web/protos/**/flow.ts')
          mkdir findings
          code=0
          if [ -n "$screens" ]; then npm run check:laws --silent -- --json --require-render $screens > findings/laws.json || code=$?; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The flows of every designer folder the pull request touches are played in a browser: one focus per state,
      # where focus starts on each level, Back, and no blank or rebuilt frame. A failing flow fails the job last.
      # Each flow writes its findings next to the laws', and the report reads the folder.
      - name: Flows, played
        id: flows
        run: |
          code=0
          designers=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- 'web/protos/*/**' | cut -d/ -f3 | sort -u)
          for designer in $designers; do
            for flow in $(find "web/protos/$designer" -name flow.ts -exec dirname {} \;); do
              npm run check:flow --silent -- "$flow" --json > "findings/flow-$(printf '%s' "$flow" | tr / _).json" || code=1
            done
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Report, comment and summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run pr:report --silent -- findings > report.md || { echo "The report could not be built."; cat findings/*.json; exit 1; }
          npm run pr:comment --silent -- report.md

      - name: Fail when the laws failed
        if: steps.laws.outputs.code != '0' || steps.flows.outputs.code != '0'
        run: exit 1
      - name: Build
        run: npm run build --prefix web
