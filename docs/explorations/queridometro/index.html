<!-- The kit's real tokens and face. Served by the live server; the relative link covers opening the file directly. Never retype their values. -->

<style>
/* ---------------------------------------------------------------------------
 * Page chrome: fixed by the designer's Figma export (1280 x 720) and Figma frame 7139:1917 (card).
 * Do not change the --explore-* values or the rules under "Chrome".
 * Design tokens: the linked tokens.css defines them (--color-semantic-*, --dimension-spacing-core-*,
 * --dimension-radius-core-*, --typography-*) and the .text-* classes give the type styles.
 * Use them with var(); never redeclare them here. All of them, by CSS name: web/protos/generated/explore-tokens.md.
 * ------------------------------------------------------------------------- */
:root {
  --explore-container-max: 992px; --explore-margin: 24px; --explore-gap: 16px; --explore-panel-w: 288px; --explore-card-min-w: 320px;
  --explore-page-bg: #181818; --explore-title: #eeeeee; --explore-label: #888888;
  --explore-tile-bg: #232323; --explore-tile-radius: 12px; --explore-tile-min-h: 234px; --explore-tile-pad: 16px; --explore-tile-gap: 16px; --explore-tile-label: #cccccc;
  --explore-toggle-border: #3f3a3a; --explore-toggle-idle-hover: rgba(255, 255, 255, 0.08); --explore-toggle-active: #5a5a5a; --explore-toggle-icon-active: #cccccc;
  --explore-btn-fill-from: #3c3c3c; --explore-btn-fill-to: #2f2f2f; --explore-btn-stroke-from: #6a6a6a; --explore-btn-stroke-to: #484848;
  --explore-font: "SF Pro", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

}

/* Chrome */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--explore-page-bg); color: var(--explore-title); font-family: var(--explore-font); -webkit-font-smoothing: antialiased; }
.explore-page { min-height: 100vh; padding: var(--explore-margin); }
/* The live panel (fixed, right, 288 px) floats over the page: the container never moves when it opens. */
.explore-container { width: 100%; max-width: var(--explore-container-max); margin-inline: auto; display: flex; flex-direction: column; gap: var(--explore-gap); }
.explore-header { display: flex; align-items: center; justify-content: space-between; gap: var(--explore-gap); min-height: 32px; }
.explore-header h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: normal; color: var(--explore-title); white-space: nowrap; }
.explore-actions { display: flex; align-items: center; gap: 12px; }
/* Filled by the live server (comment buttons); the server sets data-live. Hidden otherwise. */
#explore-actions { display: none; }
#explore-actions[data-live] { display: flex; align-items: center; padding-left: 12px; border-left: 1px solid var(--explore-toggle-border); }
.explore-items { display: grid; gap: var(--explore-gap); align-content: start; align-items: start; } /* a card hugs its option: a tall neighbour in the row does not stretch it */
.explore-items[data-view="grid"] { grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--explore-card-min-w)), 1fr)); }
.explore-items[data-view="list"] { grid-template-columns: minmax(0, 1fr); }
.opt {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--explore-tile-gap); min-height: var(--explore-tile-min-h);
  padding: var(--explore-tile-pad); background: var(--explore-tile-bg); border-radius: var(--explore-tile-radius);
}
/* A batch of variations or of more options: its title runs across all columns. */
.opt-group { grid-column: 1 / -1; margin: 8px 0 0; font-size: 14px; font-weight: 500; line-height: normal; color: var(--explore-label); }
/* Discarded on the live page: hidden, never deleted; the live page can show them again, dimmed. */
.opt[data-discarded] { display: none; }
.explore-items[data-show-discarded] .opt[data-discarded] { display: flex; opacity: .45; }
/* A tunable copy made ahead of /tune looks just like its parent: hidden, with its title, until the designer tunes it. */
.explore-items > .opt[data-pretuned], .opt-group:has(+ .opt[data-pretuned]) { display: none; }
/* Keyboard: Tab moves from card to card, and the card with this ring is the one the arrow keys drive. An option cannot remove it. */
.opt:focus-visible { outline: 2px solid var(--explore-tile-label) !important; outline-offset: 2px; }
.opt-label { margin: 0; width: 100%; min-height: 24px; display: flex; align-items: center; font-size: 14px; font-weight: 500; line-height: normal; color: var(--explore-tile-label); }
/* No background, border or padding of its own: the component sits on the card, centered. The card hugs it: taller than the minimum, the card grows. */
.opt-content { flex: 1 0 auto; width: 100%; display: flex; align-items: center; justify-content: center; }
/* The component keeps its own size (fixed or hugging its content) in grid and list alike: never fill the card. */
.opt-content > * { flex: none; max-width: 100%; }
.view-toggle { display: flex; gap: 4px; align-items: center; height: 32px; padding: 2px; border: 1px solid transparent; border-radius: 10px;
  /* Same material as the live comment buttons: gradient fill, gradient stroke (border-box layer). */
  background: linear-gradient(180deg, var(--explore-btn-fill-from) 0%, var(--explore-btn-fill-to) 100%) padding-box, linear-gradient(180deg, var(--explore-btn-stroke-from) 0%, var(--explore-btn-stroke-to) 100%) border-box; }
.view-toggle[hidden] { display: none; }
.view-toggle button { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--explore-label); cursor: pointer; }
.view-toggle button[aria-pressed="true"] { background: var(--explore-toggle-active); color: var(--explore-toggle-icon-active); }
/* States (same as the live comment buttons): hover lifts, pressed sinks; the idle button also gets a faint fill on hover. */
.view-toggle button { transition: filter 120ms ease-out, transform 120ms cubic-bezier(.2, .8, .2, 1), background-color 120ms ease-out; }
@media (hover: hover) {
  .view-toggle button:hover { filter: brightness(1.18); }
  .view-toggle button[aria-pressed="false"]:hover { background-color: var(--explore-toggle-idle-hover); }
}
.view-toggle button:active { filter: brightness(.88); transform: scale(.97); transition-duration: 60ms; }
.view-toggle button:focus-visible { outline: 2px solid var(--explore-tile-label); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .view-toggle button { transition: none; } .view-toggle button:active { transform: none; } }
.view-toggle svg { width: 16px; height: 16px; }

/* Options: styles for what goes inside the cards */
/* @explore 1 */
@keyframes o1-dissolve {
  from { opacity: 0; }
  to { opacity: 1; }
}
[data-option="1"] .card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--dimension-spacing-core-sm);
  width: var(--dimension-size-semantic-content-card-width);
  padding: var(--dimension-spacing-semantic-card-inset-expanded);
  border-radius: var(--dimension-radius-semantic-content-card);
  background: var(--color-semantic-functional-background-elevated);

}
[data-option="1"] .glow {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 144px;
  height: 144px;
  background-color: transparent;
  background-image: linear-gradient(color-mix(in srgb, var(--color-semantic-functional-rating-6) 75%, var(--color-semantic-theme-noite-dark) 25%), color-mix(in srgb, var(--color-semantic-functional-rating-6) 75%, var(--color-semantic-theme-noite-dark) 25%));
  -webkit-mask-image: radial-gradient(circle at 100% 100%, var(--color-opacity-light-100), transparent 70%);
  mask-image: radial-gradient(circle at 100% 100%, var(--color-opacity-light-100), transparent 70%);
  pointer-events: none;
}
[data-option="1"] .who {
  display: flex;
  align-items: center;
  gap: var(--dimension-spacing-core-2xs);
}
[data-option="1"] .portrait {

  height: var(--dimension-size-semantic-control-height-lg);

  flex: none;
}
[data-option="1"] .id {

  flex-direction: column;
  gap: var(--dimension-spacing-core-3xs);
}
[data-option="1"] .name {

  color: var(--color-semantic-functional-text-primary);
  text-wrap: balance;
}
[data-option="1"] .meta {

  align-items: center;
  gap: var(--dimension-spacing-core-2xs);
  margin: 0;
  color: var(--color-semantic-functional-text-muted);
}
[data-option="1"] .dot {
  width: var(--dimension-spacing-core-3xs);
  height: var(--dimension-spacing-core-3xs);
  border-radius: var(--dimension-radius-core-full);
  background: var(--color-semantic-functional-text-muted);
  display: block;
  flex: none;
}
[data-option="1"] .senders,
[data-option="1"] .line {
  animation: o1-dissolve var(--motion-semantic-duration) var(--motion-semantic-easing);
}
[data-option="1"] .senders {
  display: flex;
  align-items: center;
  gap: var(--dimension-spacing-core-2xs);

}
[data-option="1"] .face {
  position: relative;
  width: 68px;
  height: 68px;
  margin: 0;
  display: block;
  flex: none;
}
[data-option="1"] .face img {
  width: 68px;
  height: 68px;
  border-radius: var(--dimension-radius-core-full);
  object-fit: cover;
  display: block;
}
[data-option="1"] .mult {
  position: absolute;
  left: 50%;
  bottom: var(--dimension-spacing-core-3xs);
  transform: translateX(-50%);
  display: block;
  color: var(--color-semantic-functional-text-primary);
  background: var(--color-semantic-functional-background-primary);
  border-radius: var(--dimension-radius-core-xs);
  padding-inline: var(--dimension-spacing-core-3xs);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
[data-option="1"] .line {
  display: flex;
  align-items: baseline;
  gap: var(--dimension-spacing-core-2xs);
  margin: 0;
  color: var(--color-semantic-functional-text-muted);
}
[data-option="1"] .line span { white-space: nowrap; }
[data-option="1"] .n { font-variant-numeric: tabular-nums; }
[data-option="1"] .phases {
  display: flex;
  align-items: center;
  gap: var(--dimension-spacing-core-2xs);
}
[data-option="1"] .phase {
  width: var(--dimension-size-semantic-control-height);
  height: var(--dimension-size-semantic-control-height);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  appearance: none;
  color: inherit;
}
[data-option="1"] .disc {
  width: 36px;
  height: 36px;
  border-radius: var(--dimension-radius-core-full);
  background: var(--color-semantic-functional-background-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
[data-option="1"] .phase.is-current .disc {
  width: var(--dimension-size-semantic-control-height);
  height: var(--dimension-size-semantic-control-height);
}
[data-option="1"] .phase.is-current .disc::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: var(--dimension-border-width-semantic-focus-ring);
  background: var(--gradient-semantic-focus-ring);
  mask: linear-gradient(var(--color-semantic-focus-outline) 0 0) content-box exclude, linear-gradient(var(--color-semantic-focus-outline) 0 0);
  -webkit-mask: linear-gradient(var(--color-semantic-focus-outline) 0 0) content-box exclude, linear-gradient(var(--color-semantic-focus-outline) 0 0);
  pointer-events: none;
}
[data-option="1"] .glyph {
  width: var(--dimension-size-semantic-icon-lg);
  height: var(--dimension-size-semantic-icon-lg);
  display: block;
}
@media (prefers-reduced-motion: reduce) {
  [data-option="1"] .senders,
  [data-option="1"] .line { animation: none; }
}
/* /@explore 1 */

<body>
<div class="explore-page">
  <div class="explore-container">
    <header class="explore-header">
      <h1>Explorações</h1>
      <div class="explore-actions">
        <!-- Shown only with two or more options. Icons: ProIcons "grid" and "bullet-list" (Iconify); they take currentColor (#888 idle, #ccc selected). -->

<script>
// View toggle: grid (default) or list, remembered per page. Works without the live server.
(() => {
  const items = document.querySelector('.explore-items'), toggle = document.querySelector('.view-toggle');
  const key = 'explore-view:' + location.pathname;
  const set = (v) => {
    items.dataset.view = v;
    toggle.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    try { localStorage.setItem(key, v); } catch {}
  };
  // Each card is a named group, so a screen reader says which option the focus is on.
  items.querySelectorAll('.opt').forEach((o) => { o.setAttribute('role', 'group'); o.setAttribute('aria-label', o.querySelector('.opt-label')?.textContent.trim() ?? ''); });
  toggle.hidden = items.querySelectorAll('.opt').length < 2;
  toggle.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) set(b.dataset.view); });
  try { const v = localStorage.getItem(key); if (v === 'grid' || v === 'list') set(v); } catch {}
})();
</script>

  const phases = [
    { word: 'corações', n: 12, icon: 'heart', label: 'Corações', people: [
      ['milena', 'Milena', 3], ['aline', 'Aline', 1], ['diego', 'Diego', 8]
    ]},
    { word: 'risadas', n: 9, icon: 'laugh', label: 'Risadas', people: [
      ['bia', 'Bia', 2], ['milena', 'Milena', 1], ['caio', 'Caio', 6]
    ]},
    { word: 'palmas', n: 5, icon: 'clap', label: 'Palmas', people: [
      ['joao', 'João', 1], ['diego', 'Diego', 3], ['aline', 'Aline', 1]
    ]},
    { word: 'sustos', n: 0, icon: 'gasp', label: 'Sustos', people: [] }
  ]
  let index = 0
  const senders = root.querySelector('[data-part="rostos"]')
  const line = root.querySelector('[data-part="contagem"]')
  const number = root.querySelector('[data-part="numero"]')
  const word = root.querySelector('[data-part="palavra"]')
  const row = root.querySelector('[data-part="fileira"]')
  const replay = (el) => {
    el.style.animation = 'none'
    void el.offsetWidth
    el.style.animation = ''
  }
  const render = () => {
    const phase = phases[index]
    senders.replaceChildren(...phase.people.map(([id, name, times]) => {
      const face = document.createElement('figure')
      face.className = 'face'
      face.dataset.part = 'rosto'
      const img = document.createElement('img')
      img.src = png[id]
      img.alt = `${name}, ${times} vezes`
      const count = document.createElement('span')
      count.className = 'mult text-body-sm-medium'
      count.dataset.part = 'conta'
      count.textContent = `${times}x`
      face.append(img, count)
      return face
    }))
    number.textContent = String(phase.n)
    word.textContent = phase.word
    row.replaceChildren(...phases.map((item, i) => {
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'phase' + (i === index ? ' is-current' : '')
      btn.dataset.part = 'fase'
      btn.setAttribute('aria-label', item.label)
      if (i === index) btn.setAttribute('aria-current', 'true')
      const disc = document.createElement('span')
      disc.className = 'disc'
      const icon = document.createElement('img')
      icon.className = 'glyph'
      icon.alt = ''
      icon.src = png[item.icon]
      disc.append(icon)
      btn.append(disc)
      return btn
    }))
    replay(senders)
    replay(line)
  }
  render()
  root.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { if (index > 0) { index -= 1; render() } }
    else if (e.key === 'ArrowRight') { if (index < phases.length - 1) { index += 1; render() } }
    else if (e.key === 'Enter') { /* quem enviou já está no card */ }
    else if (e.key === 'Escape' || e.key === 'Backspace') {
      if (index === 0) return
      index = 0
      render()
    } else return
    e.preventDefault()
  })
})()
</script>

  let index = 0
  const slots = {
    esq: root.querySelector('[data-place="esq"]'),
    baixo: root.querySelector('[data-place="baixo"]'),
    dir: root.querySelector('[data-place="dir"]'),
  }
  const totalEl = root.querySelector('[data-part="total"]')
  const palavraEl = root.querySelector('[data-part="palavra"]')
  const marks = [...root.querySelectorAll('[data-part="reacao"]')]

  const show = (n) => {
    const item = reacoes[n]
    totalEl.textContent = item.total
    palavraEl.textContent = item.word
    for (const place of ["esq", "baixo", "dir"]) {
      const slot = slots[place]
      const img = slot.querySelector("img")
      const conta = slot.querySelector('[data-part="conta"]')
      const person = item.pessoas[place]
      if (!person) {
        slot.dataset.vazio = "true"
        img.alt = ""
        conta.textContent = ""
      } else {
        delete slot.dataset.vazio
        img.src = person.src
        img.alt = person.alt
        conta.textContent = person.count
      }
    }
    marks.forEach((mark, i) => {
      if (i === n) mark.dataset.on = "true"
      else delete mark.dataset.on
    })
  }

  root.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") {
      e.preventDefault()
      if (index > 0) show(--index)
    } else if (e.key === "ArrowRight") {
      e.preventDefault()
      if (index < reacoes.length - 1) show(++index)
    } else if (e.key === "Enter") {
      e.preventDefault()
    } else if (e.key === "Escape" || e.key === "Backspace") {
      if (index === 0) return
      e.preventDefault()
      index = 0
      show(index)
    }
  })
})()
</script>

      index -= 1
    } else if (e.key === 'ArrowRight') {
      if (index === reactions.length - 1) { e.preventDefault(); return }
      index += 1
    } else if (e.key === 'Enter') {
      /* quem enviou já está no card */
    } else if (e.key === 'Escape' || e.key === 'Backspace') {
      if (index === 0) return
      index = 0
    } else return
    e.preventDefault()
    paint()
  })
})()
</script>
