<!-- The kit's real tokens and face. Served by the live server; the relative link covers opening the file directly. Never retype their values. -->
<link rel="stylesheet" href="/__explore/tokens.css">
<link rel="stylesheet" href="../../../src/styles/global.css">
<link rel="stylesheet" href="/__explore/inter.css">
<style>
/* ---------------------------------------------------------------------------
 * Page chrome: fixed by the designer's Figma export (1280 x 720) and Figma frame 7139:1917 (card).
 * Do not change the --explore-* values or the rules under "Chrome".
 * Design tokens: the linked tokens.css defines them (--color-semantic-*, --dimension-spacing-core-*,
 * --dimension-radius-core-*, --typography-*) and the .text-* classes give the type styles.
 * Use them with var(); never redeclare them here. All of them, by CSS name: web/protos/generated/explore-tokens.md.
 * ------------------------------------------------------------------------- */
:root {
  --explore-container-max: 992px; --explore-margin: 24px; --explore-gap: 16px; --explore-panel-w: 288px; --explore-card-min-w: 320px;
  --explore-page-bg: #181818; --explore-title: #eeeeee; --explore-label: #888888;
  --explore-tile-bg: #232323; --explore-tile-radius: 12px; --explore-tile-min-h: 234px; --explore-tile-pad: 16px; --explore-tile-gap: 16px; --explore-tile-label: #cccccc;
  --explore-toggle-border: #3f3a3a; --explore-toggle-idle-hover: rgba(255, 255, 255, 0.08); --explore-toggle-active: #5a5a5a; --explore-toggle-icon-active: #cccccc;
  --explore-btn-fill-from: #3c3c3c; --explore-btn-fill-to: #2f2f2f; --explore-btn-stroke-from: #6a6a6a; --explore-btn-stroke-to: #484848;
  --explore-font: "SF Pro", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

}

/* Chrome */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--explore-page-bg); color: var(--explore-title); font-family: var(--explore-font); -webkit-font-smoothing: antialiased; }
.explore-page { min-height: 100vh; padding: var(--explore-margin); }
/* The live panel (fixed, right, 288 px) floats over the page: the container never moves when it opens. */
.explore-container { width: 100%; max-width: var(--explore-container-max); margin-inline: auto; display: flex; flex-direction: column; gap: var(--explore-gap); }
.explore-header { display: flex; align-items: center; justify-content: space-between; gap: var(--explore-gap); min-height: 32px; }
.explore-header h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: normal; color: var(--explore-title); white-space: nowrap; }
.explore-actions { display: flex; align-items: center; gap: 12px; }
/* Filled by the live server (comment buttons); the server sets data-live. Hidden otherwise. */
#explore-actions { display: none; }
#explore-actions[data-live] { display: flex; align-items: center; padding-left: 12px; border-left: 1px solid var(--explore-toggle-border); }
.explore-items { display: grid; gap: var(--explore-gap); align-content: start; align-items: start; } /* a card hugs its option: a tall neighbour in the row does not stretch it */
.explore-items[data-view="grid"] { grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--explore-card-min-w)), 1fr)); }
.explore-items[data-view="list"] { grid-template-columns: minmax(0, 1fr); }
.opt {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--explore-tile-gap); min-height: var(--explore-tile-min-h);
  padding: var(--explore-tile-pad); background: var(--explore-tile-bg); border-radius: var(--explore-tile-radius);
}
/* A batch of variations or of more options: its title runs across all columns. */
.opt-group { grid-column: 1 / -1; margin: 8px 0 0; font-size: 14px; font-weight: 500; line-height: normal; color: var(--explore-label); }
/* Discarded on the live page: hidden, never deleted; the live page can show them again, dimmed. */
.opt[data-discarded] { display: none; }
.explore-items[data-show-discarded] .opt[data-discarded] { display: flex; opacity: .45; }
/* Keyboard: Tab moves from card to card, and the card with this ring is the one the arrow keys drive. An option cannot remove it. */
.opt:focus-visible { outline: 2px solid var(--explore-tile-label) !important; outline-offset: 2px; }
.opt-label { margin: 0; width: 100%; min-height: 24px; display: flex; align-items: center; font-size: 14px; font-weight: 500; line-height: normal; color: var(--explore-tile-label); }
/* No background, border or padding of its own: the component sits on the card, centered. The card hugs it: taller than the minimum, the card grows. */
.opt-content { flex: 1 0 auto; width: 100%; display: flex; align-items: center; justify-content: center; }
/* The component keeps its own size (fixed or hugging its content) in grid and list alike: never fill the card. */
.opt-content > * { flex: none; max-width: 100%; }
.view-toggle { display: flex; gap: 4px; align-items: center; height: 32px; padding: 2px; border: 1px solid transparent; border-radius: 10px;
  /* Same material as the live comment buttons: gradient fill, gradient stroke (border-box layer). */
  background: linear-gradient(180deg, var(--explore-btn-fill-from) 0%, var(--explore-btn-fill-to) 100%) padding-box, linear-gradient(180deg, var(--explore-btn-stroke-from) 0%, var(--explore-btn-stroke-to) 100%) border-box; }
.view-toggle[hidden] { display: none; }
.view-toggle button { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--explore-label); cursor: pointer; }
.view-toggle button[aria-pressed="true"] { background: var(--explore-toggle-active); color: var(--explore-toggle-icon-active); }
/* States (same as the live comment buttons): hover lifts, pressed sinks; the idle button also gets a faint fill on hover. */
.view-toggle button { transition: filter 120ms ease-out, transform 120ms cubic-bezier(.2, .8, .2, 1), background-color 120ms ease-out; }
@media (hover: hover) {
  .view-toggle button:hover { filter: brightness(1.18); }
  .view-toggle button[aria-pressed="false"]:hover { background-color: var(--explore-toggle-idle-hover); }
}
.view-toggle button:active { filter: brightness(.88); transform: scale(.97); transition-duration: 60ms; }
.view-toggle button:focus-visible { outline: 2px solid var(--explore-tile-label); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .view-toggle button { transition: none; } .view-toggle button:active { transform: none; } }
.view-toggle svg { width: 16px; height: 16px; }

/* Options: styles for what goes inside the cards */
/* ---- Opção 1 · Bug interativo -------------------------------------------------------------------------
 * Tempos e medidas nomeados (para o /tune): troque o valor aqui, o resto da opção segue.
 *   --bug-duration       duração da entrada (kit: 800ms)
 *   --bug-ease           mola do kit (damping 15, stiffness 56, massa 1) em linear(), normalizada para chegar a 1 em 800ms
 *   --bug-text-delay     atraso do texto em relação ao início da entrada
 *   --bug-text-rise      quanto o texto sobe até o repouso
 *   --bug-halo-final     diâmetro final do halo (começa no diâmetro do Bug)
 *   --bug-gyro-duration  uma volta do halo (kit: ciclo do foco, 12000ms)
 *   --bug-right / --bug-bottom  posição do Bug no canto inferior direito (margem de segurança 40 / 32)
 * ---------------------------------------------------------------------------------------------------- */
[data-option="1"] {
  --bug-duration: var(--motion-semantic-duration);
  --bug-ease: linear(0, 0.027, 0.091, 0.176, 0.268, 0.361, 0.449, 0.53, 0.603, 0.668, 0.724, 0.773, 0.814, 0.849, 0.879, 0.903, 0.924, 0.941, 0.955, 0.967, 0.976, 0.984, 0.991, 0.996, 1);
  --bug-text-delay: 0ms;
  --bug-text-rise: var(--dimension-spacing-core-sm);
  --bug-size: var(--dimension-size-semantic-alert-bug);
  --bug-halo-final: var(--dimension-size-semantic-alert-bug-transmission);
  --bug-gyro-duration: var(--motion-semantic-focus-cycle-duration);
  --bug-right: var(--dimension-spacing-core-2xl);
  --bug-bottom: var(--dimension-spacing-core-xl);
  --bug-text-gap: calc((var(--bug-halo-final) - var(--bug-size)) / 2 + var(--dimension-spacing-core-2xs));
}

/* Palco: um quadro escuro de vídeo, só fundo para o Bug aparecer; recorte do canto inferior direito, em escala real. */
[data-option="1"] .stage {
  position: relative;
  overflow: hidden;
  width: var(--dimension-size-semantic-content-card-width);
  height: 192px;
  background: linear-gradient(135deg, var(--color-opacity-light-10), transparent 60%), var(--color-semantic-functional-background-primary);
}

[data-option="1"] .bug {
  position: absolute;
  right: var(--bug-right);
  bottom: var(--bug-bottom);
  display: block;
  width: var(--bug-size);
  height: var(--bug-size);
}

/* Camada de trás: o texto, alinhado ao centro do Bug, à esquerda dele. */
[data-option="1"] .bug-text {
  position: absolute;
  z-index: 0;
  top: 0;
  bottom: 0;
  right: calc(100% + var(--bug-text-gap));
  display: flex;
  align-items: center;
  margin: 0;
  color: var(--color-semantic-functional-text-primary);
  text-align: right;
  text-transform: uppercase;
  text-wrap: balance;
  white-space: nowrap;
  text-shadow: 0 0 8px var(--color-opacity-dark-50);
  animation: o1-text-in var(--bug-duration) var(--bug-ease) var(--bug-text-delay) both;
}

/* Halo: a mesma largura do Bug no início, cresce até o tamanho final. Máscara radial dá a borda suave. */
[data-option="1"] .bug-halo {
  position: absolute;
  z-index: 1;
  top: 50%;
  left: 50%;
  display: block;
  width: var(--bug-halo-final);
  height: var(--bug-halo-final);
  translate: -50% -50%;
  border-radius: var(--dimension-radius-semantic-pill);
  overflow: hidden;
  mask: radial-gradient(closest-side, var(--color-semantic-focus-outline) 70%, transparent 100%);
  animation: o1-halo-in var(--bug-duration) var(--bug-ease) both;
}

/* Giro: só as cores do Bug, com uma abertura suave; uma volta lenta, nunca um indicador de carregamento. */
[data-option="1"] .bug-halo-spin {
  position: absolute;
  inset: 0;
  display: block;
  background: conic-gradient(from 0deg,
    transparent 0deg,
    var(--color-semantic-theme-noite-dark) 50deg,
    var(--color-semantic-theme-dia-dark) 120deg,
    var(--color-semantic-theme-tarde-light) 200deg,
    var(--color-semantic-theme-tarde-dark) 270deg,
    transparent 330deg,
    transparent 360deg);
  animation: o1-gyro var(--bug-gyro-duration) linear var(--bug-duration) infinite both;
}

[data-option="1"] .bug-mark {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: block;
  border-radius: var(--dimension-radius-semantic-pill);
  background: var(--bug-mark-src) center / cover no-repeat;
  animation: o1-fade var(--bug-duration) var(--bug-ease) both;
}

@keyframes o1-fade { from { opacity: var(--opacity-semantic-hidden); } to { opacity: var(--opacity-semantic-visible); } }
@keyframes o1-text-in {
  from { opacity: var(--opacity-semantic-hidden); translate: 0 var(--bug-text-rise); }
  to { opacity: var(--opacity-semantic-visible); translate: 0 0; }
}
@keyframes o1-halo-in {
  from { opacity: var(--opacity-semantic-hidden); width: var(--bug-size); height: var(--bug-size); }
  to { opacity: var(--opacity-semantic-visible); width: var(--bug-halo-final); height: var(--bug-halo-final); }
}
@keyframes o1-gyro { from { rotate: 0deg; } to { rotate: 360deg; } }

/* Movimento reduzido: só dissolve, sem subida, sem crescer e sem giro (a tela funciona sem animação). */
@media (prefers-reduced-motion: reduce) {
  [data-option="1"] .bug-text, [data-option="1"] .bug-halo { animation-name: o1-fade; }
  [data-option="1"] .bug-halo-spin { animation: none; }
}
/* Reinício da entrada ao voltar para a tela (feito pelo script no fim da página). */
[data-option="1"] .stage[data-reset] * { animation: none !important; }

/* ---- Opção 2 · Ajuste da 1 · Bug interativo --------------------------------------------------------------
 * Mesma sequência da opção 1, com cada tempo e medida como variável (bloco tune:vars). Estados em data-state:
 *   entrada      toca a sequência (Bug, texto e halo entram; o giro começa quando o halo chega)
 *   permanência  composição final parada, halo girando
 * ---------------------------------------------------------------------------------------------------- */
/* Compatibilidade (alvo: Chrome 68 e Safari 16). Recurso -> mínimo de navegador:
 *   @keyframes, animation (várias por elemento, fill-mode), transform/opacity ...... Chrome 43, Safari 9 (sem prefixo)
 *   transform: translate3d / scale / rotate / translateZ ............................ Chrome 36, Safari 9
 *   custom properties var() ......................................................... Chrome 49, Safari 9.1
 *   calc() com var(), em medidas e tempos (sem min/max/clamp) ........................ Chrome 26, Safari 7
 *   linear-gradient, text-shadow, border-radius, cubic-bezier ........................ Chrome 26, Safari 7
 *   -webkit-mask + -webkit-mask-composite: xor (mask sem prefixo só reforça) ........ Chrome 4, Safari 4
 *   will-change ..................................................................... Chrome 36, Safari 9.1
 *   backface-visibility (com -webkit-) .............................................. Chrome 36, Safari 5
 *   flex (justify-content) .......................................................... Chrome 29, Safari 9
 *   webp (a imagem do Bug) .......................................................... Chrome 32, Safari 14
 *   prefers-reduced-motion .......................................................... Chrome 74, Safari 10.1 (e data-motion="reduce")
 *   script: MutationObserver Chrome 26, IntersectionObserver Chrome 51 / Safari 12.1, dataset, matchMedia (ES5).
 * Fora daqui, de propósito: linear(), inset, gap, aspect-ratio, :is(), @property, translate/scale/rotate soltos, conic-gradient,
 * min()/max()/clamp(), :focus-visible, animation-composition, filter: blur e animar width/height ou background. */
/* tune:vars */
[data-option="2"] {
  --bug-right: var(--dimension-spacing-core-2xl);
  --bug-bottom: var(--dimension-spacing-core-xl);
  --bug-size: var(--dimension-size-semantic-alert-bug);
  --bug-from-opacity: var(--opacity-semantic-hidden);
  --bug-from-scale: 0.9;
  --bug-mark-delay: 0ms;
  --bug-text-delay: 0ms;
  --bug-text-rise: var(--dimension-spacing-core-4xl);
  --bug-text-from-opacity: var(--opacity-semantic-hidden);
  --bug-text-space: var(--dimension-spacing-core-2xs);
  --bug-text-size: var(--typography-font-size-base);
  --bug-text-leading: var(--typography-line-height-normal);
  --bug-text-tracking: var(--typography-letter-spacing-tight);
  --bug-text-weight: 700;
  --bug-text-color: var(--color-semantic-functional-text-primary);
  --bug-text-shadow-blur: 8px;
  --bug-halo-delay: 0ms;
  --bug-halo-from-ratio: 0.75;
  --bug-halo-from-scale: 0.9;
  --bug-halo-from-opacity: var(--opacity-semantic-hidden);
  --bug-halo-opacity: var(--opacity-semantic-visible);
  --bug-ring-width: var(--dimension-border-width-semantic-focus-ring);
  --bug-ring-gap: var(--dimension-spacing-core-xs);
  --bug-ring-angle: 224deg;
  --bug-ring-c1: var(--color-semantic-theme-noite-dark);
  --bug-ring-s1: 21.77%;
  --bug-ring-c2: var(--color-semantic-theme-noite-light);
  --bug-ring-s2: 36.03%;
  --bug-ring-c3: #eeddfe; /* tune */
  --bug-ring-s3: 50.57%;
  --bug-ring-c4: var(--color-semantic-theme-dia-light);
  --bug-ring-s4: 57.49%;
  --bug-ring-c5: var(--color-semantic-theme-dia-dark);
  --bug-ring-s5: 65.1%;
  --bug-ring-c6: var(--color-semantic-theme-tarde-light);
  --bug-ring-s6: 75.77%;
  --bug-ring-c7: var(--color-semantic-theme-tarde-dark);
  --bug-ring-s7: 82.76%;
  --bug-gyro-duration: var(--motion-semantic-focus-cycle-duration);
  --bug-gyro-direction: normal;
  --bug-duration: var(--motion-semantic-duration);
  --bug-ease: cubic-bezier(0.19, 0.06, 0.24, 1);
  --bug-text-duration: var(--motion-semantic-duration);
  --bug-text-ease: cubic-bezier(0.19, 0.06, 0.24, 1);
  --bug-halo-duration: var(--motion-semantic-duration);
  --bug-halo-ease: cubic-bezier(0.19, 0.06, 0.24, 1);
  --bug-stay: 8000ms;
  --bug-out-duration: var(--motion-semantic-duration);
  --bug-out-ease: cubic-bezier(0.19, 0.06, 0.24, 1);
  --bug-out-delay: 0ms;
  --bug-out-text-delay: 0ms;
  --bug-out-bug-scale: 0.9;
  --bug-out-halo-scale: 0.9;
  --bug-out-text-drop: var(--dimension-spacing-core-4xl);
}

  --bug-halo-final: calc(var(--bug-size) + 2 * (var(--bug-ring-gap) + var(--bug-ring-width)));
  --bug-text-gap: calc((var(--bug-halo-final) - var(--bug-size)) / 2 + var(--bug-text-space));
}

[data-option="2"] .stage {
  position: relative;
  overflow: hidden;
  width: var(--dimension-size-semantic-content-card-width);
  height: 224px;
}

[data-option="2"] .bug {
  position: absolute;
  right: var(--bug-right);
  bottom: var(--bug-bottom);
  display: block;
  width: var(--bug-size);
  height: var(--bug-size);
}

/* As três camadas animadas: só transform e opacity, promovidas à GPU. */
[data-option="2"] .bug-text,
[data-option="2"] .bug-halo,
[data-option="2"] .bug-mark,
[data-option="2"] .bug-halo-spin {
  will-change: transform, opacity;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

/* Camada de trás: o texto, centralizado sobre o Bug e acima dele; entra de trás da esfera, subindo. */
[data-option="2"] .bug-text {
  position: absolute;
  z-index: 0;
  left: 0;
  right: 0;
  bottom: calc(100% + var(--bug-text-gap));
  display: flex;
  justify-content: center;
  margin: 0;
  font-size: var(--bug-text-size);
  font-weight: var(--bug-text-weight);
  line-height: var(--bug-text-leading);
  letter-spacing: var(--bug-text-tracking);
  color: var(--bug-text-color);
  text-align: center;
  text-transform: uppercase;
  white-space: nowrap;
  text-shadow: 0 0 var(--bug-text-shadow-blur) var(--color-opacity-dark-50);
  opacity: var(--opacity-semantic-visible);
  transform: translate3d(0, 0, 0);
}

/* Halo: caixa no tamanho final, centrada no Bug (o transform guarda o centro); a entrada cresce por escala, nunca por width/height. */
[data-option="2"] .bug-halo {
  position: absolute;
  z-index: 1;
  top: 50%;
  left: 50%;
  display: block;
  width: var(--bug-halo-final);
  height: var(--bug-halo-final);
  border-radius: var(--dimension-radius-semantic-pill);
  opacity: var(--bug-halo-opacity);
  transform: translate3d(-50%, -50%, 0);
}

/* Crescimento do halo: do tamanho do Bug até o final (escala própria, para o scale up da entrada somar a ele). */
[data-option="2"] .bug-halo-grow {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: block;
  border-radius: inherit;
  transform: translateZ(0);
}

/* O halo é o anel de foco do kit (FocusRing): uma faixa em pílula (espessura e folga do kit) com o degradê do designer, recortada
   do miolo. O giro é o transform: rotate() deste elemento, nunca o gradiente nem o background-position; uma volta lenta, nunca um indicador de carregamento. */
[data-option="2"] .bug-halo-spin {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: block;
  box-sizing: border-box;
  padding: var(--bug-ring-width);
  border-radius: inherit;
  background: linear-gradient(var(--bug-ring-angle),
    var(--bug-ring-c1) var(--bug-ring-s1),
    var(--bug-ring-c2) var(--bug-ring-s2),
    var(--bug-ring-c3) var(--bug-ring-s3),
    var(--bug-ring-c4) var(--bug-ring-s4),
    var(--bug-ring-c5) var(--bug-ring-s5),
    var(--bug-ring-c6) var(--bug-ring-s6),
    var(--bug-ring-c7) var(--bug-ring-s7));
  -webkit-mask: linear-gradient(var(--color-semantic-focus-outline) 0 0) content-box, linear-gradient(var(--color-semantic-focus-outline) 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(var(--color-semantic-focus-outline) 0 0) content-box exclude, linear-gradient(var(--color-semantic-focus-outline) 0 0);
  transform: translateZ(0);
}

[data-option="2"] .bug-mark {
  position: absolute;
  z-index: 2;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: block;
  border-radius: var(--dimension-radius-semantic-pill);
  background: var(--bug-mark-src) center / cover no-repeat;
  transform: translateZ(0);
}

/* Estado entrada: a sequência de 800ms. O Bug e o halo sobem juntos (mesmo atraso, duração e curva por padrão), com opacidade 0-100 e um pequeno scale up; o texto sai de trás. */
[data-option="2"][data-state="entrada"] .bug-mark { animation: o2-mark-in var(--bug-duration) var(--bug-ease) var(--bug-mark-delay) both; }
[data-option="2"][data-state="entrada"] .bug-text { animation: o2-text-in var(--bug-text-duration) var(--bug-text-ease) var(--bug-text-delay) both; }
[data-option="2"][data-state="entrada"] .bug-halo { animation: o2-halo-in var(--bug-halo-duration) var(--bug-halo-ease) var(--bug-halo-delay) both; }
[data-option="2"][data-state="entrada"] .bug-halo-grow { animation: o2-halo-grow var(--bug-halo-duration) var(--bug-halo-ease) var(--bug-halo-delay) both; }
[data-option="2"][data-state="entrada"] .bug-halo-spin { animation: o2-gyro var(--bug-gyro-duration) linear calc(var(--bug-halo-delay) + var(--bug-halo-duration)) infinite var(--bug-gyro-direction) both; }

/* Estado permanência: tudo no tamanho final, halo girando enquanto o componente estiver na tela. */
[data-option="2"][data-state="permanência"] .bug-halo-spin { animation: o2-gyro var(--bug-gyro-duration) linear 0s infinite var(--bug-gyro-direction); }

/* Estado saída: o Bug e o halo diminuem (scale down) e o texto desce de volta para trás do Bug, todos de 100 para 0 de opacidade, juntos. */
[data-option="2"][data-state="saída"] .bug-mark { animation: o2-mark-out var(--bug-out-duration) var(--bug-out-ease) var(--bug-out-delay) forwards; }
[data-option="2"][data-state="saída"] .bug-text { animation: o2-text-out var(--bug-out-duration) var(--bug-out-ease) calc(var(--bug-out-delay) + var(--bug-out-text-delay)) forwards; }
[data-option="2"][data-state="saída"] .bug-halo { animation: o2-halo-out var(--bug-out-duration) var(--bug-out-ease) var(--bug-out-delay) forwards; }
[data-option="2"][data-state="saída"] .bug-halo-spin { animation: o2-gyro var(--bug-gyro-duration) linear 0s infinite var(--bug-gyro-direction); }

/* Estado fora: o componente já saiu; nada desenhado, sem giro. */
[data-option="2"][data-state="fora"] .bug { display: none; }

/* Estado ciclo: entrada, permanência (--bug-stay) e saída em sequência, só por atrasos. Cada peça sai quando terminou de entrar, mais a permanência. */
[data-option="2"][data-state="ciclo"] .bug-mark { animation: o2-mark-in var(--bug-duration) var(--bug-ease) var(--bug-mark-delay) both, o2-mark-out var(--bug-out-duration) var(--bug-out-ease) calc(var(--bug-mark-delay) + var(--bug-duration) + var(--bug-stay) + var(--bug-out-delay)) forwards; }
[data-option="2"][data-state="ciclo"] .bug-text { animation: o2-text-in var(--bug-text-duration) var(--bug-text-ease) var(--bug-text-delay) both, o2-text-out var(--bug-out-duration) var(--bug-out-ease) calc(var(--bug-text-delay) + var(--bug-text-duration) + var(--bug-stay) + var(--bug-out-delay) + var(--bug-out-text-delay)) forwards; }
[data-option="2"][data-state="ciclo"] .bug-halo { animation: o2-halo-in var(--bug-halo-duration) var(--bug-halo-ease) var(--bug-halo-delay) both, o2-halo-out var(--bug-out-duration) var(--bug-out-ease) calc(var(--bug-halo-delay) + var(--bug-halo-duration) + var(--bug-stay) + var(--bug-out-delay)) forwards; }
[data-option="2"][data-state="ciclo"] .bug-halo-grow { animation: o2-halo-grow var(--bug-halo-duration) var(--bug-halo-ease) var(--bug-halo-delay) both; }
[data-option="2"][data-state="ciclo"] .bug-halo-spin { animation: o2-gyro var(--bug-gyro-duration) linear calc(var(--bug-halo-delay) + var(--bug-halo-duration)) infinite var(--bug-gyro-direction) both; }

@keyframes o2-mark-in {
  from { opacity: var(--bug-from-opacity); transform: scale(var(--bug-from-scale)) translateZ(0); }
  to { opacity: var(--opacity-semantic-visible); transform: scale(1) translateZ(0); }
}
@keyframes o2-text-in {
  from { opacity: var(--bug-text-from-opacity); transform: translate3d(0, var(--bug-text-rise), 0); }
  to { opacity: var(--opacity-semantic-visible); transform: translate3d(0, 0, 0); }
}
@keyframes o2-halo-in {
  from { opacity: var(--bug-halo-from-opacity); transform: translate3d(-50%, -50%, 0) scale(var(--bug-halo-from-scale)); }
  to { opacity: var(--bug-halo-opacity); transform: translate3d(-50%, -50%, 0) scale(1); }
}
@keyframes o2-halo-grow {
  from { transform: scale(var(--bug-halo-from-ratio)) translateZ(0); }
  to { transform: scale(1) translateZ(0); }
}
@keyframes o2-mark-out {
  from { opacity: var(--opacity-semantic-visible); transform: scale(1) translateZ(0); }
  to { opacity: var(--opacity-semantic-hidden); transform: scale(var(--bug-out-bug-scale)) translateZ(0); }
}
@keyframes o2-text-out {
  from { opacity: var(--opacity-semantic-visible); transform: translate3d(0, 0, 0); }
  to { opacity: var(--opacity-semantic-hidden); transform: translate3d(0, var(--bug-out-text-drop), 0); }
}
@keyframes o2-halo-out {
  from { opacity: var(--bug-halo-opacity); transform: translate3d(-50%, -50%, 0) scale(1); }
  to { opacity: var(--opacity-semantic-hidden); transform: translate3d(-50%, -50%, 0) scale(var(--bug-out-halo-scale)); }
}
@keyframes o2-mark-fade { from { opacity: var(--bug-from-opacity); } to { opacity: var(--opacity-semantic-visible); } }
@keyframes o2-text-fade { from { opacity: var(--bug-text-from-opacity); } to { opacity: var(--opacity-semantic-visible); } }
@keyframes o2-halo-fade { from { opacity: var(--bug-halo-from-opacity); } to { opacity: var(--bug-halo-opacity); } }
@keyframes o2-mark-out-fade { from { opacity: var(--opacity-semantic-visible); } to { opacity: var(--opacity-semantic-hidden); } }
@keyframes o2-halo-out-fade { from { opacity: var(--bug-halo-opacity); } to { opacity: var(--opacity-semantic-hidden); } }
@keyframes o2-gyro {
  from { transform: rotate(0deg) translateZ(0); }
  to { transform: rotate(360deg) translateZ(0); }
}

/* Movimento reduzido: só dissolve (entrada e saída), sem subida, escala, descida nem giro. Duas vias: a media query (Chrome 74+, Safari 10.1+)
   e o atributo data-motion="reduce" no card (o script o liga quando a media query vale; o app também pode ligá-lo, e ele cobre o Chrome 68). */
@media (prefers-reduced-motion: reduce) {
[data-option="2"][data-state="entrada"] .bug-mark { animation-name: o2-mark-fade; }
[data-option="2"][data-state="entrada"] .bug-text { animation-name: o2-text-fade; }
[data-option="2"][data-state="entrada"] .bug-halo { animation-name: o2-halo-fade; }
[data-option="2"][data-state="saída"] .bug-mark, [data-option="2"][data-state="saída"] .bug-text { animation-name: o2-mark-out-fade; }

<script>
// View toggle: grid (default) or list, remembered per page. Works without the live server.
(() => {
  const items = document.querySelector('.explore-items'), toggle = document.querySelector('.view-toggle');
  const key = 'explore-view:' + location.pathname;
  const set = (v) => {
    items.dataset.view = v;
    toggle.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    try { localStorage.setItem(key, v); } catch {}
  };
  // Each card is a named group, so a screen reader says which option the focus is on.
  items.querySelectorAll('.opt').forEach((o) => { o.setAttribute('role', 'group'); o.setAttribute('aria-label', o.querySelector('.opt-label')?.textContent.trim() ?? ''); });
  toggle.hidden = items.querySelectorAll('.opt').length < 2;
  toggle.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) set(b.dataset.view); });
  try { const v = localStorage.getItem(key); if (v === 'grid' || v === 'list') set(v); } catch {}
})();
</script>

(() => {
  const stage = document.querySelector('.opt[data-option="1"] .stage');
  let out = false;
  new IntersectionObserver(([e]) => {
    if (e.isIntersecting && out) { stage.setAttribute('data-reset', ''); void stage.offsetWidth; stage.removeAttribute('data-reset'); }
    out = !e.isIntersecting;
  }, { threshold: 0.6 }).observe(stage);
})();
</script>

<script>
// Bug interativo (ajuste): o estado vem de data-state. "entrada" e "ciclo" tocam a sequência (o card voltar à tela a reinicia).
// Quando as três peças terminam de sair, o estado vai para "fora" (nada desenhado, sem giro). Sem teclas: o Bug não recebe foco.
// Escrito em ES5 (sem ?., ??, getAnimations): roda no Chrome 68.
(function () {
  var root = document.querySelector('.opt[data-option="2"]');
  var stage = root.querySelector('.stage');
  var done = {};
  var replay = function () { stage.setAttribute('data-reset', ''); void stage.offsetWidth; stage.removeAttribute('data-reset'); };
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    var sync = function () { if (mq.matches) root.setAttribute('data-motion', 'reduce'); else root.removeAttribute('data-motion'); };
    sync();
    if (mq.addEventListener) mq.addEventListener('change', sync); else if (mq.addListener) mq.addListener(sync);
  }
  new MutationObserver(function () { done = {}; if (root.dataset.state === 'entrada') replay(); }).observe(root, { attributes: true, attributeFilter: ['data-state'] });
  root.addEventListener('animationend', function (e) {
    if (!/^o2-.*-out/.test(e.animationName) || (root.dataset.state !== 'ciclo' && root.dataset.state !== 'saída')) return;
    done[e.target.getAttribute('data-part')] = true;
    if (done.mark && done.text && done.halo) root.dataset.state = 'fora';
  });
  var out = false;
  new IntersectionObserver(function (entries) {
    var en = entries[0], s = root.dataset.state;
    if (en.isIntersecting && out && (s === 'entrada' || s === 'ciclo' || s === 'saída')) replay();
    out = !en.isIntersecting;
  }, { threshold: 0.6 }).observe(stage);
})();
</script>
